version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Module 2: Grok2API (High-concurrency multi-account gateway)
  # -------------------------------------------------------------------------
  grok2api:
    image: ghcr.io/chenyme/grok2api:latest
    container_name: grok2api-gateway
    restart: unless-stopped
    ports:
      - "${GROK2API_PORT:-3001}:8000"
    environment:
      TZ: Asia/Shanghai
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    volumes:
      - ./2-grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - ./2-grok2api/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - grok_translator_net

  # -------------------------------------------------------------------------
  # Module 3: Translation Validator Proxy (Practical 3-Tier Quality Guard)
  # -------------------------------------------------------------------------
  translation-validator:
    build:
      context: ./3-translation-validator
      dockerfile: Dockerfile
    container_name: grok-translation-validator
    restart: unless-stopped
    ports:
      - "${TRANSLATION_VALIDATOR_PORT:-3002}:3002"
    environment:
      PORT: 3002
      UPSTREAM_HOST: grok2api
      UPSTREAM_PORT: 8000
      UPSTREAM_URL: http://grok2api:8000
      ENABLE_QUALITY_PROMPT_OVERRIDE: "true"
      ENABLE_PHONETIC_TRANSLITERATION_MATCHER: "true"
    volumes:
      - ./3-translation-validator/config:/app/config
      - ./3-translation-validator/logs:/app/logs
    depends_on:
      - grok2api
    networks:
      - grok_translator_net

  # -------------------------------------------------------------------------
  # Module 1: ProGrok (Automated Protocol Registrar & Turnstile Solver)
  # -------------------------------------------------------------------------
  progrok:
    build:
      context: ./1-progrok
      dockerfile: Dockerfile
    container_name: progrok-registrar
    restart: unless-stopped
    ports:
      - "${PROGROK_WEB_PORT:-3080}:3080"
    environment:
      GROK2API_BASE_URL: http://grok2api:8000
      WEB_PORT: 3080
    volumes:
      - ./1-progrok/config:/app/config
    depends_on:
      - grok2api
    networks:
      - grok_translator_net

networks:
  grok_translator_net:
    driver: bridge
